<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B社 · 登录 · Sign in</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
// Variation B (Split Spread) — standalone, mounts directly into #root.

const Seal = ({ size = 'md' }) => (
  <div className={`lg-seal lg-seal-${size}`}><span>B社</span></div>
);

const AppleLogo = ({ size = 18, fill = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} aria-hidden>
    <path d="M17.05 11.97c-.04-3.05 2.49-4.51 2.6-4.59-1.41-2.07-3.62-2.35-4.41-2.38-1.88-.19-3.66 1.1-4.62 1.1-.97 0-2.42-1.07-3.98-1.04-2.05.03-3.94 1.19-5 3.02-2.13 3.69-.54 9.15 1.54 12.15 1.02 1.47 2.23 3.11 3.81 3.05 1.53-.06 2.11-.99 3.96-.99 1.84 0 2.36.99 3.98.96 1.64-.03 2.68-1.49 3.69-2.97 1.16-1.7 1.64-3.35 1.67-3.43-.04-.02-3.21-1.23-3.24-4.88zM14.07 4.7c.85-1.03 1.42-2.45 1.26-3.87-1.22.05-2.7.81-3.57 1.84-.79.91-1.48 2.36-1.29 3.75 1.36.11 2.75-.69 3.6-1.72z"/>
  </svg>
);
const GoogleLogo = ({ size = 18 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden>
    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
  </svg>
);

const OAuthButtons = ({ screen }) => {
  const verb = screen === 'signup' ? '注册'
             : screen === 'forgot' ? '重新尝试'
             : '登录';
  return (
    <React.Fragment>
      <button className="lg-btn lg-btn-apple"><AppleLogo /> 用 Apple {verb}</button>
      <button className="lg-btn lg-btn-google"><GoogleLogo /> 用 Google {verb}</button>
    </React.Fragment>
  );
};

const Tabs = ({ active, align = 'center' }) => {
  const go = (s) => () => { history.pushState({}, '', '?screen=' + s); window.dispatchEvent(new Event('popstate')); };
  return (
    <div className="lg-tabs" style={{ alignSelf: align === 'center' ? 'center' : align }}>
      <div className={`lg-tab ${active === 'login' ? 'active' : ''}`} onClick={go('login')}>登录</div>
      <div className={`lg-tab ${active === 'signup' ? 'active' : ''}`} onClick={go('signup')}>注册</div>
    </div>
  );
};

const FooterCopy = () => (
  <div className="lg-footer">
    继续即代表同意 <a>服务条款</a> · <a>隐私政策</a><br/>
    © 2026 BelowIceberg · B社
  </div>
);

const Advice = ({ n, text }) => (
  <div className="lg-advice">
    <div className="lg-advice-num">{n}</div>
    <div>{text}</div>
  </div>
);

const COPY = {
  login: {
    eyebrow: 'BelowIceberg · 精选文学深度注解',
    en: 'Welcome back',
    zh: '登录 · 继续你的阅读',
    sub: '你正在阅读《了不起的盖茨比》第三章 · 第七节',
    altLink: '已有邀请码？',
  },
  signup: {
    eyebrow: 'BelowIceberg · 精选文学深度注解',
    en: 'Join B社',
    zh: '注册 · 开启你的精读之旅',
    sub: '为母语为中文、深入学习英文的读者而做。',
    altLink: '已有账户？登录 →',
  },
  forgot: {
    eyebrow: '需要帮助 · Recover access',
    en: 'Trouble signing in',
    zh: '登录遇到问题？',
    sub: 'B社 使用 Apple / Google 单点登录，没有独立密码。请按以下步骤重试。',
    altLink: '返回登录 ←',
  },
};

const StatusBar = () => (
  <div className="lg-statusbar">
    <span>9:41</span>
    <div className="right">
      <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><path d="M1 7.5h2v3H1zM4.5 5.5h2v5h-2zM8 3.5h2v7H8zM11.5 1.5h2v9h-2zM15 -0.5h2v11h-2z"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" strokeWidth="1.2"><path d="M1 5.5a8.5 8.5 0 0 1 14 0M3.5 7.5a5 5 0 0 1 9 0M6 9.5a2.5 2.5 0 0 1 4 0"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="2.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="19" height="9" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="5" rx="1" fill="currentColor" opacity="0.5"/></svg>
    </div>
  </div>
);

const VariationB = ({ device, screen }) => {
  const c = COPY[screen];
  const isMobile = device === 'mobile';

  if (isMobile) {
    return (
      <div className="lg">
        <StatusBar />
        <div className="lg-illust" style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '38%' }}>
          <img src="/assets/cover-art-gatsby.jpeg" alt="" />
          <div className="lg-illust-overlay"></div>
          <div className="lg-illust-mark" style={{ bottom: 18, left: 22, gap: 10 }}>
            <Seal size="sm" />
            <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.2 }}>
              <span style={{ fontFamily: "'Playfair Display',serif", fontSize: 13, fontWeight: 700 }}>BelowIceberg</span>
              <span style={{ fontFamily: "'Noto Serif SC',serif", fontSize: 9, letterSpacing: '0.18em', textShadow: '0 1px 4px rgba(0,0,0,0.5)' }}>B社 · 深度精读</span>
            </div>
          </div>
        </div>

        <div className="lg-parchment" style={{ position: 'absolute', top: '36%', left: 0, right: 0, bottom: 0, padding: '24px 26px' }}>
          <div style={{ position: 'relative', zIndex: 1, height: '100%', display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div className="lg-eyebrow" style={{ textAlign: 'left', fontSize: 9.5 }}>{c.eyebrow}</div>
            <div>
              <h1 className="lg-h1-en" style={{ textAlign: 'left', fontSize: 28, lineHeight: 1.1 }}>{c.en}</h1>
              <p className="lg-h1-zh" style={{ textAlign: 'left', fontSize: 12, marginTop: 4 }}>{c.zh}</p>
            </div>
            <p className="lg-sub" style={{ textAlign: 'left', fontSize: 12.5 }}>{c.sub}</p>

            {screen === 'forgot' ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <Advice n="1" text="确保你曾用同一邮箱登录过 B社。" />
                <Advice n="2" text="联系 hello@belowiceberg.com 协助找回。" />
                <div style={{ height: 4 }}></div>
                <OAuthButtons screen="forgot" />
                <a className="lg-link lg-link-gold" style={{ alignSelf: 'flex-start', marginTop: 4 }}>{c.altLink}</a>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <OAuthButtons screen={screen} />
                <a className="lg-link" style={{ alignSelf: 'flex-start' }}>用邮箱链接登录 →</a>
              </div>
            )}

            <div style={{ marginTop: 'auto' }}><FooterCopy /></div>
          </div>
        </div>
      </div>
    );
  }

  // desktop: 50/50 split
  return (
    <div className="lg" style={{ display: 'flex' }}>
      <div className="lg-illust" style={{ flex: 1 }}>
        <img src="/assets/cover-art-gatsby.jpeg" alt="" />
        <div className="lg-illust-overlay"></div>
        <div className="lg-illust-mark">
          <Seal size="md" />
          <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.2 }}>
            <span style={{ fontFamily: "'Playfair Display',serif", fontSize: 22, fontWeight: 700, letterSpacing: '0.01em' }}>BelowIceberg</span>
            <span style={{ fontFamily: "'Noto Serif SC',serif", fontSize: 11, letterSpacing: '0.22em', textShadow: '0 1px 4px rgba(0,0,0,0.5)' }}>B社 · 深度精读</span>
          </div>
        </div>
      </div>

      <div className="lg-parchment" style={{ flex: 1, position: 'relative' }}>
        <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32, zIndex: 1 }}>
          <div style={{ width: 420, display: 'flex', flexDirection: 'column', gap: 22 }}>
            <div className="lg-eyebrow" style={{ textAlign: 'left' }}>{c.eyebrow}</div>
            <div>
              <h1 className="lg-h1-en" style={{ textAlign: 'left', fontSize: 44, lineHeight: 1.08 }}>{c.en}</h1>
              <p className="lg-h1-zh" style={{ textAlign: 'left', fontSize: 15, marginTop: 6 }}>{c.zh}</p>
            </div>

            {screen !== 'forgot' && <Tabs active={screen} align="flex-start" />}

            <p className="lg-sub" style={{ textAlign: 'left', fontSize: 14, marginTop: -4 }}>{c.sub}</p>

            {screen === 'forgot' ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <Advice n="1" text="确保你曾用同一邮箱登录过 B社。" />
                <Advice n="2" text="在 Apple ID 或 Google 账户设置中，确认 B社 仍获授权。" />
                <Advice n="3" text="仍无法登录？联系 hello@belowiceberg.com，附上你常用邮箱。" />
                <div style={{ height: 4 }}></div>
                <OAuthButtons screen="forgot" />
                <a className="lg-link lg-link-gold" style={{ alignSelf: 'flex-start', marginTop: 6 }} onClick={() => { history.pushState({},'','?screen=login'); window.dispatchEvent(new Event('popstate')); }}>{c.altLink}</a>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <OAuthButtons screen={screen} />
                <div className="lg-or" style={{ margin: '8px 0' }}>OR · 或</div>
                <a className="lg-link" style={{ alignSelf: 'flex-start' }}>用邮箱链接登录 →</a>
                {screen === 'login' && (
                  <a className="lg-link" style={{ alignSelf: 'flex-start', fontSize: 12, color: 'var(--text3)' }} onClick={() => { history.pushState({},'','?screen=forgot'); window.dispatchEvent(new Event('popstate')); }}>
                    无法登录？
                  </a>
                )}
              </div>
            )}

            <div style={{ marginTop: 14 }}><FooterCopy /></div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── Root ────────────────────────────────────────────────────────────
const useScreen = () => {
  const get = () => {
    const s = new URLSearchParams(location.search).get('screen');
    return s === 'signup' || s === 'forgot' ? s : 'login';
  };
  const [screen, setScreen] = React.useState(get);
  React.useEffect(() => {
    const onPop = () => setScreen(get());
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  return screen;
};

const useDevice = () => {
  const get = () => window.innerWidth < 700 ? 'mobile' : 'desktop';
  const [device, setDevice] = React.useState(get);
  React.useEffect(() => {
    const onR = () => setDevice(get());
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);
  return device;
};

const App = () => {
  const screen = useScreen();
  const device = useDevice();
  return <VariationB device={device} screen={screen} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
