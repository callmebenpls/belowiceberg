<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B社 · 设置 · Settings</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-screen-label="Settings / 设置">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const SECTIONS = [
  { id: 'account',     num: '一', zh: '账户',     en: 'Account' },
  { id: 'tokens',      num: '二', zh: '代币',     en: 'Tokens' },
  { id: 'annotations', num: '三', zh: '注解',     en: 'Annotations' },
  { id: 'data',        num: '四', zh: '数据与账户', en: 'Data' },
];

const CATS = [
  { id: 'vocab',     label: '词汇' },
  { id: 'gram',      label: '语法' },
  { id: 'structure', label: '句子结构' },
  { id: 'lit',       label: '文学手法' },
  { id: 'cult',      label: '文化背景' },
  { id: 'style-c',   label: '风格分析' },
];

const RECHARGE_TIERS = [
  { tokens: 100,  rmb: 38,  label: '入门 · Starter'  },
  { tokens: 300,  rmb: 98,  label: '常读 · Reader', bonus: '+30 代币', popular: true },
  { tokens: 1000, rmb: 298, label: '深读 · Scholar', bonus: '+200 代币' },
];

const TOKEN_USES = [
  { what: '完整教学版（含原文 · 注解 · 句法树）', cost: 500 },
  { what: '单章试读',                            cost: 50  },
  { what: 'EPUB 导出',                           cost: 30  },
  { what: '编辑部按需注解（一处）',                cost: 10  },
];

// ─── HOOKS ──────────────────────────────────────────
const useMe = () => {
  const [me, setMe] = React.useState(null);
  const [loaded, setLoaded] = React.useState(false);
  React.useEffect(() => {
    fetch('/api/me', { credentials: 'same-origin' })
      .then(r => { if (r.status === 401) { location.href = '/login/?next=/settings/'; return null; } return r.json(); })
      .then(data => { if (data) { setMe(data); setLoaded(true); } });
  }, []);
  return { me, setMe, loaded };
};

const patchMe = async (patch) => {
  const r = await fetch('/api/me', {
    method: 'PATCH', credentials: 'same-origin',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(patch),
  });
  return r.ok;
};

// ─── ATOMS ──────────────────────────────────────────
const Toggle = ({ on, onClick }) => (
  <div className={`st-toggle ${on ? 'on' : ''}`} role="switch" aria-checked={on} onClick={onClick}></div>
);
const Field = ({ label, sub, children, disabled }) => (
  <div className="st-field" {...(disabled ? {'data-v1-disabled': 'true'} : {})}>
    <div className="label">
      <span className="k">{label}</span>
      {sub && <span className="sub">{sub}</span>}
    </div>
    <div className="control">{children}</div>
  </div>
);

const initialsOf = (name) => (name || '?').trim().slice(0, 1).toUpperCase();
const joinedOf = (me) => {
  if (!me || !me.created_at) return '';
  try {
    const d = new Date(me.created_at);
    return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
  } catch (e) { return ''; }
};

// ─── ACCOUNT ────────────────────────────────────────
const Account = ({ me, setMe }) => {
  const [pwOpen, setPwOpen] = React.useState(false);
  const [pwCur, setPwCur] = React.useState('');
  const [pwNew, setPwNew] = React.useState('');
  const [pwErr, setPwErr] = React.useState('');
  const submitPw = async (e) => {
    e.preventDefault(); setPwErr('');
    const r = await fetch('/api/me/change-password', {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({current: pwCur, new: pwNew}),
    });
    if (r.ok) { setPwOpen(false); setPwCur(''); setPwNew(''); alert('密码已更新'); }
    else { const j = await r.json().catch(()=>({})); setPwErr(j.detail || '失败'); }
  };

  return (
    <section className="st-sec" id="account">
      <div className="st-sec-head">
        <span className="num">一</span>
        <h2>账户 · Account</h2>
        <span className="meta">verified · 已验证</span>
      </div>

      <div className="st-account-card">
        <div className="av">
          {initialsOf(me.display_name)}
          <div className="edit" title="更换头像" data-v1-disabled="true">✎</div>
        </div>
        <div className="right">
          <span className="name">{me.display_name}</span>
          <span className="email">{me.email}</span>
          {joinedOf(me) && <span className="meta">加入于 {joinedOf(me)}</span>}
        </div>
      </div>

      <Field label="姓名 · Display name" sub="出现在注解评论与你的书房页面。">
        <input className="st-input" defaultValue={me.display_name}
          onBlur={async (e) => {
            const v = e.target.value.trim();
            if (v && v !== me.display_name) {
              if (await patchMe({display_name: v})) setMe({...me, display_name: v});
            }
          }} />
      </Field>

      <Field label="邮箱 · Email" sub="用于登录与编辑部信件投递。" disabled>
        <span className="st-value">
          {me.email} <a className="editlink">更换 →</a>
        </span>
      </Field>

      <Field label="密码 · Password" sub="建议至少 8 位。">
        <button className="st-btn" onClick={() => setPwOpen(!pwOpen)}>修改密码</button>
        {pwOpen && (
          <form onSubmit={submitPw} style={{display:'flex',flexDirection:'column',gap:8,marginTop:8,maxWidth:320}}>
            <input type="password" placeholder="当前密码" value={pwCur} onChange={e=>setPwCur(e.target.value)} required className="st-input"/>
            <input type="password" placeholder="新密码 (8+ 字符)" value={pwNew} onChange={e=>setPwNew(e.target.value)} required minLength={8} className="st-input"/>
            {pwErr && <div className="st-err">{pwErr}</div>}
            <button type="submit" className="st-btn st-btn-primary">确认</button>
          </form>
        )}
      </Field>
    </section>
  );
};

// ─── TOKENS (visual-only, disabled) ─────────────────
const Tokens = ({ me }) => (
  <section className="st-sec" id="tokens" data-v1-disabled="true">
    <div className="st-sec-head">
      <span className="num">二</span>
      <h2>代币 · Tokens</h2>
      <span className="meta">books · exports · annotations</span>
    </div>

    <div className="st-token-balance">
      <div className="left">
        <span className="ey">YOUR BALANCE · 余额</span>
        <span className="num">{(me.balance || 0).toLocaleString()}<small> 代币</small></span>
        <span className="sub">够再买 1 部教学版 + 2 次 EPUB 导出</span>
      </div>
      <button className="st-cta-gold" disabled>充值 →</button>
    </div>

    <Field label="充值套餐 · Recharge" sub="代币不会过期。在 B社 内可用于购买教学版、单章试读、EPUB 导出、按需注解。">
      <div></div>
    </Field>

    <div className="st-tiers">
      {RECHARGE_TIERS.map(t => (
        <button key={t.tokens} className={`st-tier ${t.popular ? 'popular' : ''}`} disabled>
          {t.popular && <span className="st-tier-tag">最受欢迎</span>}
          <span className="st-tier-label">{t.label}</span>
          <span className="st-tier-num">{t.tokens.toLocaleString()}<small> 代币</small></span>
          {t.bonus && <span className="st-tier-bonus">{t.bonus}</span>}
          <span className="st-tier-price">¥{t.rmb}</span>
        </button>
      ))}
    </div>

    <Field label="代币能买什么 · What tokens buy" sub="价格随选书定期调整，最终以购买时为准。">
      <div></div>
    </Field>
    <div className="st-uses">
      {TOKEN_USES.map((u, i) => (
        <div className="st-use-row" key={i}>
          <span className="what">{u.what}</span>
          <span className="cost">{u.cost} <small>代币</small></span>
        </div>
      ))}
    </div>

    <Field label="交易记录 · Transaction history" sub="查看充值、消费、退款记录。">
      <button className="st-btn" disabled>查看记录 →</button>
    </Field>
  </section>
);

// ─── ANNOTATIONS ────────────────────────────────────
const Annotations = ({ me, setMe }) => (
  <section className="st-sec" id="annotations">
    <div className="st-sec-head">
      <span className="num">三</span>
      <h2>注解 · Annotations</h2>
      <span className="meta">six dimensions · 六个视角</span>
    </div>

    <Field label="默认显示哪些类别 · Visible by default"
           sub="点击切换。隐藏的类别仍可在阅读时按需展开。" disabled>
      <div className="st-cats">
        {CATS.map(c => (
          <div key={c.id} className={`cat ${c.id} on`}>
            <span className="dot"></span>{c.label}
          </div>
        ))}
      </div>
    </Field>

    <Field label="注解卡片默认展开 · Cards open by default"
           sub="关闭后，每段进入时只显示卡片标题，点击展开正文。">
      <label className="st-toggle">
        <input type="checkbox" checked={!!me.cards_open_default}
          onChange={async (e) => {
            const v = e.target.checked;
            if (await patchMe({cards_open_default: v})) setMe({...me, cards_open_default: v});
          }} />
        <span>注解卡片默认展开</span>
      </label>
    </Field>
  </section>
);

// ─── DATA ───────────────────────────────────────────
const Data = () => (
  <section className="st-sec" id="data">
    <div className="st-sec-head">
      <span className="num">四</span>
      <h2>数据与账户 · Data</h2>
      <span className="meta">danger zone · 请谨慎操作</span>
    </div>

    <Field label="清除阅读进度 · Reset reading progress"
           sub="所有书目的位置标记将回到第一章 · 第一节。书签保留。">
      <button className="st-btn st-btn-danger" onClick={async () => {
        if (!confirm('确认清除所有阅读进度？此操作不可撤销。')) return;
        const r = await fetch('/api/me/clear-progress', { method:'POST', credentials:'same-origin' });
        if (r.ok) alert('阅读进度已清除'); else alert('失败');
      }}>清除阅读进度</button>
    </Field>

    <Field label="注销 · Sign out" sub="保留你的数据。下次登录时一切照旧。">
      <button className="st-btn" onClick={async () => {
        await fetch('/api/auth/logout', { method:'POST', credentials:'same-origin' });
        location.href = '/';
      }}>退出登录</button>
    </Field>

    <Field label="永久删除账户 · Delete account"
           sub="不可恢复。我们会在 30 天内清除你的全部数据。剩余代币不退款。" disabled>
      <button className="st-btn st-btn-danger" disabled>删除我的账户 →</button>
    </Field>
  </section>
);

// ─── APP ────────────────────────────────────────────
const Page = ({ me, setMe }) => (
  <React.Fragment>
    <nav className="st-nav">
      <div style={{ display: 'flex', alignItems: 'center' }}>
        <div className="seal"><span>B社</span></div>
        <span className="brand-en">BelowIceberg</span>
      </div>
      <div className="links">
        <a href="/library/">书房</a>
        <a href="/library/">书目</a>
        <a>编辑部</a>
      </div>
      <div className="user">
        <span className="name">{me.display_name}</span>
        <div className="avatar">{initialsOf(me.display_name)}</div>
      </div>
    </nav>

    <div className="st-page">
      <div className="st-wrap">

        <aside className="st-toc">
          <div className="ey">SETTINGS · 目录</div>
          {SECTIONS.map(sec => (
            <a key={sec.id} href={`#${sec.id}`}>
              <span className="num">{sec.num}</span>
              <span>{sec.zh} · {sec.en}</span>
            </a>
          ))}
        </aside>

        <main className="st-main">
          <header className="st-header">
            <span className="st-eyebrow">Settings · 偏好与账户</span>
            <h1 className="st-h1">设置</h1>
          </header>

          <Account me={me} setMe={setMe} />
          <Tokens me={me} />
          <Annotations me={me} setMe={setMe} />
          <Data />
        </main>

      </div>
    </div>
  </React.Fragment>
);

const App = () => {
  const { me, setMe, loaded } = useMe();
  if (!loaded || !me) return <div style={{padding:'60px',textAlign:'center',fontFamily:"'Noto Serif SC',serif",color:'#6a6353'}}>加载中…</div>;
  return <Page me={me} setMe={setMe} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  const id = a.getAttribute('href').slice(1);
  const t  = document.getElementById(id);
  if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});
</script>
</body>
</html>
