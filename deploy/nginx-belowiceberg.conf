server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/belowiceberg;
    index index.html;

    # Static files served directly
    location /static/ {
        alias /opt/belowiceberg/static/;
        access_log off;
        expires 1h;
    }

    # API: reverse proxy to uvicorn (preserve SSE)
    # proxy_read_timeout 300s to support long annotation job streams
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;        # critical for SSE
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Admin pages served as static HTML from web root
    location /admin/ {
        try_files $uri $uri/index.html =404;
    }

    location = /gatsby { try_files /gatsby.html =404; }

    location / { try_files $uri $uri/ =404; }
}
